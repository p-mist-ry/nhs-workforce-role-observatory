# =====================================================================
# Pipeline settings
# =====================================================================
version: 0.2.0

storage:
  # Advert content may only be stored in the private vault repository.
  # Collectors stop safely if the vault is not attached.
  require_vault: true

publish:
  # false = the public dashboard shows labels, counts and links to adverts,
  # but no sentences quoted from adverts. Only change this after taking
  # advice that publishing short quotations is permitted.
  evidence_snippets: false

feed_search_probes:
  # Uses NHS Jobs' documented `keyword` search, which looks through the job
  # title and full advert text excluding 'About us' (API guide V1.07).
  # Results are UNVERIFIED search matches: how multi-word terms are matched
  # is not documented. They are never counted in the headline AI indicator.
  enabled: true
  source_id: nhsjobs
  params:
    limit: 100
    sort: publicationDateAsc
  max_pages_per_term: 20      # 2,000 adverts per term at most
  terms:
    - {id: ai_acronym, keyword: "AI"}
    - {id: artificial_intelligence, keyword: "artificial intelligence"}
    - {id: machine_learning, keyword: "machine learning"}
    - {id: generative_ai, keyword: "generative AI"}
    - {id: large_language_model, keyword: "large language model"}
    - {id: chatgpt, keyword: "ChatGPT"}
    - {id: copilot, keyword: "Copilot"}
    - {id: ambient_voice, keyword: "ambient voice"}
    - {id: ai_scribe, keyword: "AI scribe"}
    - {id: predictive_analytics, keyword: "predictive analytics"}
    - {id: algorithm, keyword: "algorithm"}
    - {id: robotic_process_automation, keyword: "robotic process automation"}
    - {id: automation, keyword: "automation"}

dedup:
  # Two adverts from different sources are the same vacancy only if their
  # descriptions are this similar (Jaccard similarity of 5-word shingles).
  min_text_similarity: 0.85
  # Adverts of the same source and id seen on different days are the
  # same vacancy. A re-advert after this gap is treated as a new vacancy.
  readvert_gap_days: 45

change_detection:
  min_adverts_per_cell: 30       # suppress indicators for small cells
  baseline_months: 6             # months pooled as the comparison baseline

genai:
  enabled: false                 # stays off until you deliberately switch it on
  provider: anthropic
  # Official Messages API endpoint, documented at docs.claude.com.
  api_url: "https://api.anthropic.com/v1/messages"
  anthropic_version_header: "2023-06-01"
  # Copy an exact model id from the official models page before enabling.
  model: null
  max_items_per_run: 20          # hard cost cap per daily run
  max_output_tokens: 2000
  temperature: 0
  stages: [extraction, classification, verification]
  # The API key is read from the GitHub secret ANTHROPIC_API_KEY.
