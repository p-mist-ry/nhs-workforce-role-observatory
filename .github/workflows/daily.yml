# Daily collection, processing, validation and dashboard update.
#
# Runs:
#   * every day at 05:17 UTC (schedule)
#   * when you press "Run workflow" on the Actions tab (workflow_dispatch)
#   * a lighter "check" job whenever you edit config, prompts, scripts or tests
#
# Advert content is stored ONLY in the private vault repository
# (<your account>/nhs-observatory-vault). This public repository receives
# results: logs and the dashboard data. The vault is opened with the
# VAULT_TOKEN secret (README: "The private vault").
#
# Run logs of a public repository are public: the scripts print counts,
# never advert text.

name: Daily observatory run

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "prompts/**"
      - "scripts/**"
      - "tests/**"
      - "logs/change_log.csv"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Runs after you edit files: tests + validation only, nothing collected.
  # ------------------------------------------------------------------
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate (compare with previous commit)
        run: python scripts/validate.py --git-base HEAD~1 --no-log

  # ------------------------------------------------------------------
  # The daily pipeline.
  # ------------------------------------------------------------------
  daily:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OBSERVATORY_VAULT: ${{ github.workspace }}/vault
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Unit tests
        env:
          OBSERVATORY_VAULT: ""      # tests never touch the vault
        run: python -m unittest discover -s tests -v

      # Fails here if the VAULT_TOKEN secret is missing, wrong or expired.
      - name: Open the private vault
        id: vault
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nhs-observatory-vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
          fetch-depth: 1

      # Copies the 2026 pilot files into the vault once (never overwrites).
      - name: Bring pilot data into the vault
        run: |
          mkdir -p vault/observations
          if [ -d data/observations ]; then cp -rn data/observations/. vault/observations/; fi
          rm -f vault/observations/README.md

      # Collectors stop safely (and log why) until their source is configured.
      - name: Collect NHS Jobs (England and Wales)
        continue-on-error: true
        run: python scripts/collect_nhsjobs.py
      - name: Collect NHS Scotland
        continue-on-error: true
        run: python scripts/collect_scotland.py
      - name: Collect HSC Northern Ireland
        continue-on-error: true
        run: python scripts/collect_hscni.py
      - name: Ask NHS Jobs search which adverts mention AI terms
        continue-on-error: true
        run: python scripts/probe_feed_search.py

      - name: Normalise
        run: python scripts/normalize.py
      - name: Deduplicate
        run: python scripts/deduplicate.py
      - name: Rule-based classification
        run: python scripts/classify_rules.py
      - name: GenAI classification (skipped unless enabled)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/classify_genai.py --mode classify
      - name: Detect changes
        run: python scripts/detect_changes.py

      - name: Validate
        id: validate
        continue-on-error: true
        run: python scripts/validate.py --git-base HEAD

      - name: Build dashboard data
        if: always() && steps.vault.outcome == 'success'
        run: python scripts/build_dashboard_data.py

      # Advert content goes to the private vault only.
      - name: Save to the private vault
        if: always() && steps.vault.outcome == 'success'
        working-directory: vault
        run: |
          git config user.name "observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in observations probes derived/genai_runs; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new for the vault."
            exit 0
          fi
          git commit -q -m "Daily run ${{ github.run_id }}"
          git push -q

      - name: Record that the vault could not be opened
        if: failure() && steps.vault.outcome == 'failure'
        run: >
          python scripts/log_event.py open_vault BLOCKED_VAULT_UNAVAILABLE
          "Could not open the private vault, so nothing was collected. Check that the
          VAULT_TOKEN secret exists and has not expired (README: Renewing the vault key)."

      # Only results (logs and dashboard data) are published here.
      - name: Publish results
        if: always()
        run: |
          git config user.name "observatory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in logs docs/data data/dashboard; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -q -m "Daily run ${{ github.run_id }}"
          git pull -q --rebase origin main
          git push -q

      - name: Report validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Validation failed. Open logs/qa_log.csv and look at the newest FAIL rows."
          exit 1
